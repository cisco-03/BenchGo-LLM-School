<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGUF Tracker — Surveillance Hugging Face</title>
  <style>
    :root {
      --bg-0: #0a0e14;
      --bg-1: #11161d;
      --bg-2: #161b22;
      --bg-3: #1c2128;
      --bg-elev: #22272e;
      --border: #2d333b;
      --border-soft: #21262d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --accent: #58a6ff;
      --accent-2: #1f6feb;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-pill: 999px;
      --shadow-card: 0 1px 0 rgba(255,255,255,0.03), 0 2px 8px rgba(0,0,0,0.25);
      --fs-small: 0.82rem;
      --fs-tiny: 0.72rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body {
      background: var(--bg-0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      padding: 16px;
      min-height: 100vh;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    body::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    /* En-tete */
    .tracker-header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .tracker-header h1 {
      font-size: 1.35rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tracker-header .subtitle { color: var(--text-muted); font-size: var(--fs-tiny); margin-top: 2px; }
    .header-btns { display: flex; gap: 8px; align-items: center; }

    /* Boutons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: var(--r-sm);
      border: 1px solid var(--border); background: var(--bg-3);
      color: var(--text); font-size: var(--fs-small); font-weight: 600;
      cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--text); transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      border-color: var(--accent-2); color: #fff;
    }
    .btn-primary:hover { box-shadow: 0 3px 12px rgba(31,111,235,0.4); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; transform: none; }

    /* Barre de config */
    .config-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding: 12px 16px; font-size: var(--fs-small);
      background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md);
    }
    .config-bar .toggle-group { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .config-bar label {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      color: var(--text-muted);
    }
    .config-bar label:hover { color: var(--text); }
    .config-bar input[type="checkbox"] {
      width: 15px; height: 15px; accent-color: var(--accent);
    }
    #notifyStatus { color: var(--text-dim); font-size: var(--fs-tiny); }
    #notifyStatus.ok { color: var(--green); }
    #notifyStatus.err { color: var(--red); }
    #notifyStatus.warn { color: var(--yellow); }

    /* Banniere d'alerte */
    #alertBanner {
      display: none; font-size: var(--fs-small); padding: 10px 16px;
      background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.35);
      color: #7dd3fc; border-radius: var(--r-md);
    }
    #alertBanner b { color: var(--accent); }
    #alertBanner button {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font-weight: 700; text-decoration: underline; font-size: inherit;
    }

    /* Filtres */
    .filters {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
      padding: 16px; background: var(--bg-2);
      border: 1px solid var(--border); border-radius: var(--r-md);
    }
    @media (max-width: 720px) { .filters { grid-template-columns: 1fr; } }
    .filter-label { display: block; font-size: var(--fs-tiny); font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .filter-input {
      width: 100%; padding: 8px 12px; font-size: var(--fs-small);
      background: var(--bg-0); border: 1px solid var(--border); border-radius: var(--r-sm);
      color: var(--text); transition: border-color 0.18s ease;
    }
    .filter-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.18); }
    .filter-input::placeholder { color: var(--text-dim); }
    .size-row { display: flex; align-items: center; gap: 8px; }
    .size-row input[type="range"] { width: 100%; accent-color: var(--accent); }
    .size-val { font-weight: 700; color: var(--accent); font-size: var(--fs-small); min-width: 36px; text-align: right; }
    .filter-toggles { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 22px; }
    .filter-toggles label {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      color: var(--text-muted); font-size: var(--fs-small);
    }
    .filter-toggles label:hover { color: var(--text); }
    .filter-toggles input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); }

    /* Statut */
    #status { font-size: var(--fs-tiny); color: var(--text-muted); }

    /* Liste des modeles */
    .model-list {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    @media (max-width: 720px) { .model-list { grid-template-columns: 1fr; } }
    .model-card {
      padding: 14px; border-radius: var(--r-md); border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
      box-shadow: var(--shadow-card); transition: all 0.2s ease;
      display: flex; flex-direction: column; gap: 8px;
    }
    .model-card:hover { border-color: var(--border-soft); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
    .model-card.fav { border-color: rgba(210,153,34,0.5); background: rgba(210,153,34,0.06); }
    .model-card.new { border-color: rgba(56,189,248,0.6); background: rgba(56,189,248,0.06); }
    .model-card.updated { border-color: rgba(63,185,80,0.5); background: rgba(63,185,80,0.06); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-top-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
    .card-link {
      font-weight: 700; color: var(--accent); text-decoration: none;
      font-size: var(--fs-small); word-break: break-all;
    }
    .card-link:hover { text-decoration: underline; }
    .new-tag {
      font-size: 10px; background: var(--accent); color: #fff;
      padding: 2px 6px; border-radius: var(--r-sm); font-weight: 700; white-space: nowrap;
    }
    .tested-tag {
      font-size: 10px; background: var(--green); color: #fff;
      padding: 2px 6px; border-radius: var(--r-sm); font-weight: 700; white-space: nowrap;
    }
    .model-card.tested { border-color: rgba(63,185,80,0.45); }
    .model-card.tested:hover { border-color: rgba(63,185,80,0.65); }
    .fav-btn {
      background: none; border: none; cursor: pointer; font-size: 1.1rem;
      color: var(--yellow); transition: transform 0.15s ease; flex-shrink: 0;
    }
    .fav-btn:hover { transform: scale(1.15); }
    .fav-btn:not(.active) { color: var(--text-dim); }
    .card-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: var(--fs-tiny); color: var(--text-muted);
    }
    .card-update-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; background: rgba(63,185,80,0.1);
      border: 1px solid rgba(63,185,80,0.3); border-radius: var(--r-sm);
    }
    .card-update-bar span { font-size: var(--fs-tiny); color: var(--green); font-weight: 700; }
    .card-update-bar button {
      font-size: var(--fs-tiny); background: var(--green); border: none; color: #fff;
      padding: 4px 10px; border-radius: var(--r-sm); font-weight: 700; cursor: pointer;
      transition: filter 0.18s ease;
    }
    .card-update-bar button:hover { filter: brightness(1.15); }

    /* Boutons bas */
    .bottom-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">

    <!-- En-tete -->
    <div class="tracker-header">
      <div>
        <h1>HF GGUF Tracker & Monitor</h1>
        <div class="subtitle">Surveillance temps reel & alertes sonores de mise a jour</div>
      </div>
      <div class="header-btns">
        <button class="btn" onclick="testNotification()">Tester le Son & Alerte</button>
        <button class="btn btn-primary" id="refreshBtn" onclick="loadModels()">
          <span id="refreshSpin" class="spin" style="display:none">...</span>
          <span>Rafraichir</span>
        </button>
      </div>
    </div>

    <!-- Barre de configuration des notifications -->
    <div class="config-bar">
      <div class="toggle-group">
        <label>
          <input type="checkbox" id="autoCheck" onchange="toggleAutoCheck()">
          <span>Auto-rafraichissement (5 min)</span>
        </label>
        <label>
          <input type="checkbox" id="soundAlert" checked>
          <span>Alerte sonore</span>
        </label>
        <label>
          <input type="checkbox" id="desktopAlert" checked onchange="requestNotifyPermission()">
          <span>Notification navigateur</span>
        </label>
        <label>
          <input type="checkbox" id="alertNewModels">
          <span>Alerter les nouveaux modeles</span>
        </label>
      </div>
      <div id="notifyStatus">Permission notifications : non verifiee</div>
    </div>

    <!-- Banniere d'alerte nouveautes -->
    <div id="alertBanner"></div>

    <!-- Filtres -->
    <div class="filters">
      <div>
        <label class="filter-label" for="searchInput">Recherche / Nom</label>
        <input type="text" id="searchInput" class="filter-input" placeholder="ex: Qwen, Mistral, DeepSeek..." oninput="applyFilters()">
      </div>
      <div>
        <label class="filter-label">Taille Max (Milliards de params)</label>
        <div class="size-row">
          <input type="range" id="sizeRange" min="1" max="80" value="80" oninput="document.getElementById('sizeVal').innerText = this.value + 'B'; applyFilters();">
          <span id="sizeVal" class="size-val">80B</span>
        </div>
      </div>
      <div class="filter-toggles">
        <label>
          <input type="checkbox" id="favOnly" onchange="applyFilters()">
          <span>Favoris uniquement</span>
        </label>
        <label>
          <input type="checkbox" id="newOnly" onchange="applyFilters()">
          <span>Nouveaux</span>
        </label>
        <label>
          <input type="checkbox" id="testedOnly" onchange="applyFilters()" title="Afficher uniquement les modeles deja testes dans BenchGo">
          <span>Testes</span>
        </label>
        <label>
          <input type="checkbox" id="reputableOnly" onchange="applyFilters()">
          <span>Editeurs verifies</span>
        </label>
      </div>
    </div>

    <!-- Statut et Liste -->
    <div id="status">Chargement...</div>
    <div id="modelList" class="model-list"></div>

    <div class="bottom-actions">
      <button class="btn" id="showMoreBtn" onclick="showMore()" style="display:none"></button>
      <button class="btn btn-primary" id="loadMoreApiBtn" onclick="loadMoreApi()" style="display:none">Charger plus de modeles depuis l'API</button>
    </div>
  </div>

  <script>
    const TRUSTED_PUBLISHERS = ["bartowski", "unsloth", "QuantFactory", "lmstudio-community", "Lewdiculous", "mradermacher", "MaziyarPanahi", "ggml-org"];
    const REPUTABLE_FAMILIES = ["qwen", "gemma", "llama", "mistral", "deepseek", "phi", "devstral", "ministral", "glm", "hermes"];

    // Tags de pipeline qui indiquent un vrai modele de langage (LLM).
    // On exclut object-detection, image-classification, feature-extraction, etc.
    const LLM_PIPELINE_TAGS = [
      'text-generation', 'text2text-generation', 'conversational',
      'feature-extraction', 'text-classification', 'tokenization',
      'fill-mask', 'summarization', 'translation'
    ];

    const PAGE_SIZE = 250;
    const RENDER_CHUNK = 60;
    const API_URL = 'https://huggingface.co/api/models';

    // Clé localStorage pour la persistance de la liste complète des modèles.
    // On stocke les métadonnées minimales (id, lastModified, downloads) pour
    // que les modèles déjà vus survivent à un reload / changement d'onglet.
    const STORED_MODELS_KEY = 'hf_gguf_stored_models';
    const MAX_STORED_MODELS = 5000; // limite anti-dépassement quota localStorage

    let rawModels = [];
    let favorites = JSON.parse(localStorage.getItem('hf_starred_models') || '{}');
    let tracked = JSON.parse(localStorage.getItem('hf_tracked_models') || '{}');
    let newModelsSet = new Set();
    let testedModels = new Set();
    let audioCtx = null;
    let autoCheckInterval = null;
    let currentOffset = 0;
    let hasMore = false;
    let filteredCache = [];

    // --- Persistance des modèles en localStorage ---
    // Sauvegarde les métadonnées minimales de tous les modèles déjà chargés.
    // Au prochain démarrage, on restaure ces modèles avant même de contacter
    // l'API, puis on fusionne avec les nouveaux reçus.
    function saveStoredModels() {
      try {
        const minimal = rawModels.map(m => ({
          id: m.id,
          lastModified: m.lastModified,
          downloads: m.downloads || 0
        }));
        // Limite pour ne pas dépasser le quota localStorage (~5 Mo)
        const trimmed = minimal.length > MAX_STORED_MODELS
          ? minimal.slice(minimal.length - MAX_STORED_MODELS)
          : minimal;
        localStorage.setItem(STORED_MODELS_KEY, JSON.stringify(trimmed));
      } catch (e) {
        // Quota dépassé : on essaie de sauver au moins la moitié
        try {
          const half = rawModels.slice(-Math.floor(MAX_STORED_MODELS / 2))
            .map(m => ({ id: m.id, lastModified: m.lastModified, downloads: m.downloads || 0 }));
          localStorage.setItem(STORED_MODELS_KEY, JSON.stringify(half));
        } catch (e2) {}
      }
    }

    function loadStoredModels() {
      try {
        const data = JSON.parse(localStorage.getItem(STORED_MODELS_KEY) || '[]');
        if (Array.isArray(data) && data.length > 0) {
          rawModels = data;
        }
      } catch (e) {}
    }

    // --- Réception des modèles testés depuis le classement parent ---
    // Le classement (leaderboard.js ou consolidate-leaderboard.js) envoie via
    // postMessage la liste des modèles qu'il a déjà testés. Le tracker les
    // met en surbrillance avec un badge vert "Testé" pour éviter de
    // retélécharger un modèle déjà évalué.
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'benchgo-tested-models') return;
      const list = e.data.models || [];
      testedModels = new Set();
      list.forEach(function(name) {
        if (typeof name === 'string' && name.trim()) {
          testedModels.add(normalizeModelName(name));
        }
      });
      if (rawModels.length > 0) applyFilters();
    });

    // Normalise un nom de modèle pour le rapprochement :
    // - minuscules
    // - retire les accents
    // - retire les séparateurs (/ - _ . @) pour comparer la racine
    function normalizeModelName(s) {
      return s.toLowerCase()
        .replace(/[áàâä]/g, 'a').replace(/[éèêë]/g, 'e').replace(/[íìîï]/g, 'i').replace(/[óòôö]/g, 'o').replace(/[úùûü]/g, 'u')
        .replace(/[@/_.\-]/g, '')
        .replace(/\s+/g, '')
        .replace(/\b(gguf|quantized|imatrix|ofm|instruct|chat|it|v\d+|q\d+[_a-z]*|iq\d+[_a-z]*|f16|fp16|bp16)\b/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    // Vérifie si un repo HF (ex: "bartowski/Qwen2.5-7B-Instruct-GGUF") correspond
    // à un modèle déjà testé. Rapprochement par nom de base normalisé.
    function isModelTested(repoId) {
      if (testedModels.size === 0) return false;
      const normRepo = normalizeModelName(repoId);
      // Le repo HF contient souvent le nom de base après le "/" :
      // "bartowski/Qwen2.5-7B-Instruct-GGUF" -> on teste la partie après le "/"
      const parts = repoId.split('/');
      const modelNameOnly = parts.length > 1 ? parts.slice(1).join('/') : repoId;
      const normModelOnly = normalizeModelName(modelNameOnly);
      // On teste aussi le repo complet (cas où le carnet a le format "author/model")
      for (const tested of testedModels) {
        if (normRepo === tested) return true;
        // Containment : "qwen257binstruct" contenu dans "qwen257binstructgguf"
        if (normRepo.length > 6 && (normRepo.includes(tested) || tested.includes(normRepo))) return true;
        if (normModelOnly.length > 6 && (normModelOnly === tested || normModelOnly.includes(tested) || tested.includes(normModelOnly))) return true;
      }
      return false;
    }
    let renderedCount = 0;
    let isLoading = false;

    // --- UTILITAIRES ---
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function escapeAttr(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function parseParamsB(name) {
      const m = name.match(/(\d+(?:\.\d+)?)\s*([bmk])/i);
      if (!m) return null;
      const v = parseFloat(m[1]);
      const unit = m[2].toLowerCase();
      if (unit === 'b') return v;
      if (unit === 'm') return v / 1000;
      if (unit === 'k') return v / 1e6;
      return null;
    }

    // Filtre les repos qui ne sont PAS des modeles LLM GGUF.
    // L'API ?library=gguf n'est pas stricte : elle retourne aussi des datasets,
    // des repos vides, des modeles de vision, etc.
    // Critere : library_name === "gguf" OU tags contient "gguf", ET
    // pipeline_tag dans LLM_PIPELINE_TAGS (ou pas de pipeline_tag mais
    // tags contient "text-generation").
    function isLLMGGUFModel(m) {
      const tags = m.tags || [];
      const hasGGUFTag = tags.includes('gguf') || m.library_name === 'gguf';
      if (!hasGGUFTag) return false;

      const pipeline = m.pipeline_tag || '';
      if (pipeline) {
        return LLM_PIPELINE_TAGS.includes(pipeline);
      }

      // Pas de pipeline_tag : on accepte si les tags contiennent un indice LLM
      return tags.some(t => t === 'text-generation' || t === 'conversational' || t === 'llama.cpp' || t === 'quantized');
    }

    // --- SYNTÉTISEUR SONORE (Web Audio API) ---
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playNotificationSound() {
      if (!document.getElementById('soundAlert').checked) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain1.gain.setValueAtTime(0.2, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.3);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
        gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.15);
        osc2.stop(ctx.currentTime + 0.5);
      } catch (e) {
        console.warn("Erreur AudioContext:", e);
      }
    }

    // --- NOTIFICATIONS NAVIGATEUR ---
    function requestNotifyPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(perm => {
          updateNotifyStatus();
        });
      }
    }

    function updateNotifyStatus() {
      const el = document.getElementById('notifyStatus');
      if (!('Notification' in window)) {
        el.innerText = "Notifications non supportees";
        el.className = "warn";
      } else if (Notification.permission === 'granted') {
        el.innerText = "Notifications navigateur activees";
        el.className = "ok";
      } else if (Notification.permission === 'denied') {
        el.innerText = "Notifications bloquees par le navigateur";
        el.className = "err";
      } else {
        el.innerText = "Permission notifications en attente";
        el.className = "";
      }
    }

    function sendDesktopNotification(title, body, url) {
      if (document.getElementById('desktopAlert').checked && 'Notification' in window && Notification.permission === 'granted') {
        const notif = new Notification(title, {
          body: body,
          icon: 'https://huggingface.co/front/assets/huggingface_logo-noborder.svg'
        });
        if (url) {
          notif.onclick = () => window.open(url, '_blank');
        }
      }
    }

    function testNotification() {
      playNotificationSound();
      if (Notification.permission !== 'granted') {
        requestNotifyPermission();
      } else {
        sendDesktopNotification("Test de Notification HF", "Le systeme d'alerte sonore et visuel fonctionne correctement !");
      }
    }

    // --- ÉTAT DE CHARGEMENT ---
    function setRefreshing(on) {
      const btn = document.getElementById('refreshBtn');
      const spin = document.getElementById('refreshSpin');
      btn.disabled = on;
      spin.style.display = on ? 'inline-block' : 'none';
    }

    // --- RÉCUPÉRATION & DÉTECTION (API paginée) ---
    async function fetchPage(offset) {
      const url = `${API_URL}?library=gguf&sort=lastModified&direction=-1&limit=${PAGE_SIZE}&offset=${offset}`;
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}`);
      }
      return res.json();
    }

    async function loadModels(reset = true) {
      if (isLoading) return;
      isLoading = true;
      if (reset) {
        // On ne vide PAS rawModels au reset : on fusionne avec les modèles
        // persistés et les nouveaux de l'API. newModelsSet est réinitialisé
        // pour ne détecter que les vrais nouveaux de cette session.
        currentOffset = 0;
        newModelsSet = new Set();
      }
      setRefreshing(true);
      const status = document.getElementById('status');
      status.innerHTML = 'Interrogation de l\'API Hugging Face...';
      try {
        const page = await fetchPage(currentOffset);
        hasMore = Array.isArray(page) && page.length === PAGE_SIZE;

        const knownIds = new Set(rawModels.map(m => m.id));
        let apiCount = 0;
        page.forEach(m => {
          // Filtre : on ne garde que les vrais modeles LLM GGUF
          if (!isLLMGGUFModel(m)) return;
          apiCount++;
          if (!knownIds.has(m.id)) {
            // Modèle inconnu de rawModels → soit nouveau, soit restauré depuis localStorage
            rawModels.push(m);
            // Nouveau modele = jamais suivi auparavant (persiste dans tracked)
            if (!tracked[m.id]) {
              newModelsSet.add(m.id);
            }
          }
          // Met à jour les métadonnées (downloads, lastModified peuvent changer)
          if (tracked[m.id] && tracked[m.id] !== m.lastModified) {
            // Mise à jour détectée pour un modèle déjà connu
            const existing = rawModels.find(rm => rm.id === m.id);
            if (existing) {
              existing.lastModified = m.lastModified;
              existing.downloads = m.downloads || 0;
            }
          }
          // Suivi persistant de la derniere version connue
          tracked[m.id] = m.lastModified;
        });
        localStorage.setItem('hf_tracked_models', JSON.stringify(tracked));
        saveStoredModels();

        const now = new Date().toLocaleTimeString('fr-FR');
        status.innerHTML = `${rawModels.length} modele(s) GGUF en memoire - derniere verif a ${now}`;

        checkFavUpdates(rawModels);
        updateAlertBanner();

        if (reset && document.getElementById('alertNewModels').checked && newModelsSet.size > 0) {
          playNotificationSound();
          sendDesktopNotification(
            `${newModelsSet.size} nouveau(x) modele(s) GGUF`,
            `De nouveaux modeles GGUF sont disponibles sur Hugging Face.`,
            API_URL
          );
        }

        applyFilters();
        document.getElementById('loadMoreApiBtn').style.display = hasMore ? 'inline-flex' : 'none';
      } catch (err) {
        // Si l'API échoue, on affiche quand même les modèles persistés
        const now = new Date().toLocaleTimeString('fr-FR');
        status.innerHTML = `${rawModels.length} modele(s) en memoire (hors-ligne) - echec API a ${now} : ${escapeHtml(err.message)}`;
        applyFilters();
      } finally {
        isLoading = false;
        setRefreshing(false);
      }
    }

    async function loadMoreApi() {
      if (isLoading || !hasMore) return;
      currentOffset += PAGE_SIZE;
      await loadModels(false);
    }

    function updateAlertBanner() {
      const banner = document.getElementById('alertBanner');
      const newCount = newModelsSet.size;
      if (newCount === 0) {
        banner.style.display = 'none';
        return;
      }
      banner.style.display = 'block';
      banner.innerHTML = `<b>${newCount}</b> nouveau(x) modele(s) GGUF detecte(s) depuis votre dernier passage. ` +
        `<button onclick="document.getElementById('newOnly').checked=true; applyFilters();">Afficher uniquement les nouveaux</button>`;
    }

    function checkFavUpdates(models) {
      let updateFound = false;

      models.forEach(m => {
        const repoId = m.id;
        if (favorites[repoId]) {
          const lastKnown = favorites[repoId].lastKnownUpdate;
          if (lastKnown && lastKnown !== m.lastModified) {
            updateFound = true;
            sendDesktopNotification(
              "Mise a jour de modele detectee !",
              `${repoId} vient d'etre mis a jour sur Hugging Face.`,
              `https://huggingface.co/${repoId}`
            );
          }
        }
      });

      if (updateFound) {
        playNotificationSound();
      }
    }

    function toggleFavorite(repoId, lastModified) {
      if (favorites[repoId]) {
        delete favorites[repoId];
      } else {
        favorites[repoId] = { starredAt: new Date().toISOString(), lastKnownUpdate: lastModified };
      }
      localStorage.setItem('hf_starred_models', JSON.stringify(favorites));
      applyFilters();
    }

    function markAsAck(repoId, currentLastModified) {
      if (favorites[repoId]) {
        favorites[repoId].lastKnownUpdate = currentLastModified;
        localStorage.setItem('hf_starred_models', JSON.stringify(favorites));
        applyFilters();
      }
    }

    function toggleAutoCheck() {
      const enabled = document.getElementById('autoCheck').checked;
      if (enabled) {
        autoCheckInterval = setInterval(() => loadModels(true), 300000);
      } else if (autoCheckInterval) {
        clearInterval(autoCheckInterval);
      }
    }

    // --- FILTRES & RENDU (par chunks) ---
    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const favOnly = document.getElementById('favOnly').checked;
      const newOnly = document.getElementById('newOnly').checked;
      const testedOnly = document.getElementById('testedOnly').checked;
      const reputableOnly = document.getElementById('reputableOnly').checked;
      const maxSize = parseInt(document.getElementById('sizeRange').value, 10) || 80;

      filteredCache = rawModels.filter(m => {
        const repoId = m.id || '';
        const parts = repoId.split('/');
        const author = parts[0];
        const modelName = parts.slice(1).join('/');
        if (!modelName) return false;

        const isFav = !!favorites[repoId];
        if (favOnly && !isFav) return false;
        if (newOnly && !newModelsSet.has(repoId)) return false;

        const isTested = isModelTested(repoId);
        if (testedOnly && !isTested) return false;

        if (reputableOnly && !isFav) {
          if (!TRUSTED_PUBLISHERS.includes(author)) return false;
          const isReputableName = REPUTABLE_FAMILIES.some(f => modelName.toLowerCase().includes(f));
          if (!isReputableName) return false;
        }

        if (search && !repoId.toLowerCase().includes(search)) return false;

        const sizeB = parseParamsB(modelName);
        if (sizeB !== null && sizeB > maxSize) return false;

        return true;
      });

      renderedCount = RENDER_CHUNK;
      renderFiltered();
    }

    function renderFiltered() {
      const container = document.getElementById('modelList');
      container.innerHTML = '';

      const slice = filteredCache.slice(0, renderedCount);
      const frag = document.createDocumentFragment();
      slice.forEach(m => frag.appendChild(buildCard(m)));
      container.appendChild(frag);

      const showMore = document.getElementById('showMoreBtn');
      const remaining = filteredCache.length - renderedCount;
      if (remaining > 0) {
        showMore.style.display = 'inline-flex';
        showMore.innerText = `Afficher plus (${remaining} restant(s))`;
      } else {
        showMore.style.display = 'none';
      }
    }

    function showMore() {
      renderedCount = Math.min(renderedCount + RENDER_CHUNK, filteredCache.length);
      renderFiltered();
    }

    function buildCard(m) {
      const repoId = m.id;
      const lastMod = new Date(m.lastModified);
      const dateStr = lastMod.toLocaleDateString('fr-FR') + ' a ' + lastMod.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
      const isFav = !!favorites[repoId];
      const isNew = newModelsSet.has(repoId);
      const isTested = isModelTested(repoId);

      let hasNewUpdate = false;
      let cardClass = '';
      if (isFav && favorites[repoId].lastKnownUpdate && favorites[repoId].lastKnownUpdate !== m.lastModified) {
        hasNewUpdate = true;
        cardClass = 'updated';
      } else if (isFav) {
        cardClass = 'fav';
      } else if (isNew) {
        cardClass = 'new';
      }
      if (isTested) {
        cardClass = cardClass ? cardClass + ' tested' : 'tested';
      }

      const sizeB = parseParamsB(repoId.split('/').slice(1).join('/') || '');
      const sizeLabel = sizeB !== null ? ` - ~${sizeB}B` : '';

      const card = document.createElement('div');
      card.className = 'model-card' + (cardClass ? ' ' + cardClass : '');

      card.innerHTML = `
        <div class="card-top">
          <div class="card-top-left">
            <a href="https://huggingface.co/${escapeHtml(repoId)}" target="_blank" class="card-link">${escapeHtml(repoId)}</a>
            ${isNew ? '<span class="new-tag">NOUVEAU</span>' : ''}
            ${isTested ? '<span class="tested-tag" title="Ce modele a deja ete teste dans BenchGo">TESTE</span>' : ''}
          </div>
          <button onclick="toggleFavorite('${escapeAttr(repoId)}', '${escapeAttr(m.lastModified)}')" class="fav-btn ${isFav ? 'active' : ''}" title="Favori">
            ${isFav ? '&#9733;' : '&#9734;'}
          </button>
        </div>
        <div class="card-meta">
          <span>Modifie : ${escapeHtml(dateStr)}</span>
          <span>${m.downloads || 0} telechargements${escapeHtml(sizeLabel)}</span>
        </div>
        ${hasNewUpdate ? `
          <div class="card-update-bar">
            <span>Nouvelle version disponible</span>
            <button onclick="markAsAck('${escapeAttr(repoId)}', '${escapeAttr(m.lastModified)}')">Marquer comme lu</button>
          </div>
        ` : ''}
      `;
      return card;
    }

    updateNotifyStatus();

    document.addEventListener('click', () => {
      if (document.getElementById('desktopAlert').checked
          && 'Notification' in window
          && Notification.permission === 'default') {
        requestNotifyPermission();
      }
    }, { once: true });

    // --- Démarrage : restaurer les modèles persistés puis interroger l'API ---
    // 1) On charge immédiatement les modèles sauvegardés en localStorage pour
    //    que l'utilisateur voie sa liste s'afficher sans attendre l'API.
    // 2) On lance ensuite le fetch de l'API qui fusionnera les nouveautés.
    loadStoredModels();
    if (rawModels.length > 0) {
      const now = new Date().toLocaleTimeString('fr-FR');
      document.getElementById('status').innerHTML = `${rawModels.length} modele(s) en memoire - recuperation des nouveautes...`;
      applyFilters();
    }
    loadModels();
  </script>
</body>
